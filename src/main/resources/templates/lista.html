<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Livros</title></head>
<body>
<h1>Livros</h1>
<a th:href="@{/livros/novo}">Novo livro</a>

<table border="1">
    <tr><th>ID</th><th>Título</th><th>Autor</th><th>Categoria</th><th>Status</th></tr>
    <tr th:each="livro : ${livros}">
        <td th:text="${livro.id}"></td>
        <td th:text="${livro.titulo}"></td>
        <td th:text="${livro.autor}"></td>
        <td th:text="${livro.categoria}"></td>
        <td th:text="${livro.status}"></td>
    </tr>
</table>
</body>
</html>
