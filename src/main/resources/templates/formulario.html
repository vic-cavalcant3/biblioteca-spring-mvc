<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Livro</title>
</head>
<body>
<h1>Cadastrar Livro</h1>

<form th:action="@{/livros}" th:object="${livro}" method="post">

    <label>Título</label>
    <input type="text" th:field="*{titulo}">
    <span th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></span>
    <br>

    <label>Autor</label>
    <input type="text" th:field="*{autor}">
    <span th:if="${#fields.hasErrors('autor')}" th:errors="*{autor}"></span>
    <br>

    <label>ISBN</label>
    <input type="text" th:field="*{isbn}">
    <span th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></span>
    <br>

    <label>Ano de publicação</label>
    <input type="number" th:field="*{anoPublicacao}">
    <span th:if="${#fields.hasErrors('anoPublicacao')}" th:errors="*{anoPublicacao}"></span>
    <br>

    <label>Categoria</label>
    <select th:field="*{categoria}">
        <option value="">Selecione</option>
        <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"></option>
    </select>
    <span th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></span>
    <br>

    <button type="submit">Cadastrar</button>
</form>

<a th:href="@{/livros}">Voltar</a>
</body>
</html>
